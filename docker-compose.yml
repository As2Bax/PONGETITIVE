name: pongetitive

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        COMMIT: ${COMMIT:-DEV}
    ports:
      - "8280:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    expose:
      - "8280"
    environment:
      PONG_ALLOWED_ORIGINS: "" # Empty = allow all origins (not recommended for production)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8280').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
